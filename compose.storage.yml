services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  mongo-setup:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -c
      - |
        mongosh --host mongo:27017 --quiet --eval '
          try {
            rs.status();
            print("Replica set ya inicializado");
          } catch (e) {
            print("Inicializando replica set...");
            printjson(rs.initiate({
              _id: "rs0",
              members: [{ _id: 0, host: "mongo:27017" }]
            }));
          }
        '

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mongo_data:
